<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24406f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<title>Agenda Cabinas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;700;800&family=Red+Hat+Text:wght@400;500;600&display=swap">
<style>
/* Layout: app de una pantalla — cabecera con centro y avisos, vista activa, barra de pestañas inferior */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --sunken:#f6f7fb; --ink:#17213a; --muted:#5a6680; --line:#dbe1eb;
  --accent:#24406f; --accent-soft:#e4eaf5; --on-accent:#ffffff;
  --ok:#2c7a49; --warn:#a85f12; --bad:#c0392b; --bad-soft:#fbe7e4;
  --f-display:"Red Hat Display",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Red Hat Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1320; --surface:#161e30; --sunken:#111827; --ink:#e5eaf4; --muted:#98a4bd; --line:#28324a;
  --accent:#8fa9e0; --accent-soft:#1d2842; --on-accent:#0e1320;
  --ok:#6cc48a; --warn:#e3a35c; --bad:#ef7a6c; --bad-soft:#3a1d1b; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 4px) calc(96px + env(safe-area-inset-bottom,0px))}
h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}

/* cabecera */
header.top{display:flex;align-items:center;gap:10px;padding-block:12px 8px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.top .t{min-width:0;flex:1}
.top h1{font-family:var(--f-display);font-weight:800;font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;font-size:12px;color:var(--muted)}
.bell{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.bell svg{width:21px;height:21px}
.bell b{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center}

/* pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}

/* controles */
.primary{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600}
.danger{background:var(--bad);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;flex:none}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:2px 10px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;display:flex;align-items:center;gap:6px}
.chips button i{width:9px;height:9px;border-radius:3px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:6px 10px}
.toolbar input[type=search]{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.grow{flex:1}

/* agenda */
.daybar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:6px}
.daybar .date{font-family:var(--f-display);font-weight:700;font-size:16px;flex:1;text-align:center}
.daybar .date::first-letter{text-transform:uppercase}
.summary{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.summary b{color:var(--ink);font-variant-numeric:tabular-nums}
.gridwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.grid{min-width:calc(48px + var(--cols) * 128px)}
.ghead,.gbody{display:grid;grid-template-columns:48px repeat(var(--cols),minmax(0,1fr))}
.ghead{border-bottom:1px solid var(--line);position:sticky;top:0}
.ghead div{padding:8px;font-weight:600;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghead small{display:block;font-weight:400;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.gbody{position:relative}
.times{position:relative}
.times span{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-7px);font-variant-numeric:tabular-nums}
.col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour));cursor:copy}
.now{position:absolute;left:48px;right:0;height:2px;background:var(--bad);z-index:3;pointer-events:none}
.appt{position:absolute;left:3px;right:3px;border-radius:8px;padding:3px 6px 3px 8px;font-size:12px;line-height:1.25;overflow:hidden;border:0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface));text-align:left;color:var(--ink)}
.appt b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.appt.realizada{opacity:.6}
.appt.novino{opacity:.55}
.appt.novino b{text-decoration:line-through}
.appt.choque{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad);border-left-color:var(--bad)}
.appt .flag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;border-radius:5px;padding:0 5px;margin-top:2px}
.flag.red{background:var(--bad);color:#fff}
.flag.wait{background:var(--warn);color:#fff}
.flag.new{background:var(--accent);color:var(--on-accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 2px}
.legend span{display:flex;align-items:center;gap:5px}
.note{font-size:12.5px;color:var(--muted);margin:12px 2px}

/* listas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main small{color:var(--muted);font-size:12.5px}
.row .end{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent);flex:none}
.lang{font-size:11px;font-weight:700;letter-spacing:.06em;border-radius:6px;padding:2px 6px;background:var(--accent-soft);color:var(--accent)}
.sect{display:flex;align-items:center;gap:8px;margin:20px 2px 8px;font-family:var(--f-display);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sect i{width:10px;height:10px;border-radius:3px}
.sect button{margin-left:auto;text-transform:none;letter-spacing:0}
.bad{color:var(--bad)} .ok{color:var(--ok)} .warn{color:var(--warn)}
.tagline{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:11px;border-radius:5px;padding:1px 6px;background:var(--sunken);border:1px solid var(--line);color:var(--muted)}

/* facturación */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:4px 6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em}
.stat b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;border-top:1px solid var(--line)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-top:0}
th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:700}
.bars{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px}
.bar .track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px}

/* hojas y diálogos */
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
#dialog .scrim{z-index:50}
.sheet h3{font-size:19px;margin-bottom:2px}
.field{display:grid;gap:4px;margin-top:12px}
.field>label,.flabel{font-size:12.5px;color:var(--muted);font-weight:600}
.field input:not([type=checkbox]):not([type=radio]),.field select,.field textarea{border:1px solid var(--line);background:var(--sunken);border-radius:10px;padding:10px 12px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.actions>*{flex:1}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg button{border:1px solid var(--line);background:var(--sunken);border-radius:99px;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg button[data-col][aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.box{border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13.5px}
.box.red{background:var(--bad-soft);color:var(--bad);font-weight:600}
.box.info{background:var(--accent-soft);color:var(--ink)}
.box.warnb{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--ink)}
.err{color:var(--bad);font-size:13.5px;margin-top:10px;font-weight:600}
.msg{width:100%;min-height:110px;border:1px solid var(--line);background:var(--sunken);border-radius:10px;padding:10px 12px;margin-top:8px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:4px}
.checks label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--sunken);font-size:14px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sunken);margin-top:12px}
.switch input{width:20px;height:20px}
.results{display:grid;margin-top:6px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.results button{border:0;border-top:1px solid var(--line);background:var(--sunken);text-align:left;padding:9px 12px}
.results button:first-child{border-top:0}
.picked{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sunken)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;z-index:70;max-width:calc(100% - 32px);text-align:center}
.alarm .sheet{box-shadow:0 0 0 4px var(--bad)}

/* pantallas de acceso */
.center{min-height:100%;display:grid;place-items:center;padding-inline:16px;padding-block:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;width:100%;max-width:400px}
.card h2{font-size:22px}
.welcome{max-width:460px}
.demo-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.roles{display:grid;gap:10px;margin-top:16px}
.role{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--sunken)}
.role:first-child{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.role:first-child small{color:var(--on-accent);opacity:.85}
.role svg{width:28px;height:28px;flex:none;margin-top:2px}
.role b{display:block;font-family:var(--f-display);font-size:16px}
.role small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.role:disabled{opacity:.6;cursor:wait}
.secure ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.secure li{margin-top:4px}
.secure li b{display:inline;font-size:inherit;margin:0;color:var(--ink)}
.secure{display:flex;gap:12px;margin-top:18px;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--ok) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 30%,var(--line));font-size:13px;line-height:1.45}
.secure svg{width:26px;height:26px;flex:none;color:var(--ok)}
.secure b{display:block;font-size:14px;margin-bottom:2px}
.secure p{margin:6px 0 0;color:var(--muted)}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

/* vistas semana, mes y año */
.grid.semana{min-width:calc(48px + 7 * 112px)}
.ghead .hoy{color:var(--accent)}
.dayhead{border:0;background:none;padding:0;font-weight:600;text-transform:capitalize;color:inherit}
.dayhead b{font-family:var(--f-display);font-size:16px}
.month{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mhead,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mhead span{padding:8px 6px;font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;border-bottom:1px solid var(--line)}
.mcell{position:relative;min-height:96px;border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:none;text-align:left;padding:5px 5px 6px;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.mcell:nth-child(7n+1){border-left:0}
.mcell.fuera{background:var(--sunken)}
.mcell.fuera .mnum{color:var(--muted);opacity:.6}
.mcell.hoy .mnum{background:var(--accent);color:var(--on-accent);border-radius:99px;padding:0 7px}
.mnum{font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px;align-self:flex-start;font-variant-numeric:tabular-nums}
.mdot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}
.mline{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c);padding-left:4px;background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:3px}
.mmore{font-size:11px;color:var(--muted);font-weight:600}
.mcount{display:none;position:absolute;right:5px;top:5px;font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;background:var(--accent-soft);color:var(--accent)}
@media (max-width:640px){.mcell{min-height:64px}.mline,.mmore{display:none}.mcount{display:block;position:static;align-self:flex-start;margin-top:auto}}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ymonth{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px}
.yname{border:0;background:none;padding:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;width:100%;font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:capitalize;color:var(--ink)}
.yname small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);text-transform:none}
.yhead,.ygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.yhead span{font-size:10.5px;color:var(--muted);text-align:center;font-weight:700}
.ycell{border:0;border-radius:5px;aspect-ratio:1;max-width:100%;font-size:11px;padding:0;font-variant-numeric:tabular-nums;color:var(--ink);display:inline-grid;place-items:center}
.ycell.n0{background:var(--sunken);color:var(--muted)}
.ycell.n1{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.ycell.n2{background:color-mix(in srgb,var(--accent) 42%,var(--surface))}
.ycell.n3{background:color-mix(in srgb,var(--accent) 65%,var(--surface));color:var(--on-accent)}
.ycell.n4{background:var(--accent);color:var(--on-accent)}
.ycell.hoy{box-shadow:0 0 0 2px var(--bad)}
select.pill{padding:6px 10px}

/* horario y festivos */
.appt{z-index:1}
.cerrado{position:absolute;left:0;right:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(135deg,var(--sunken) 0 7px,color-mix(in srgb,var(--line) 70%,var(--sunken)) 7px 9px)}
.cerrado.todo{top:0;bottom:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--warn) 14%,var(--surface)) 0 8px,color-mix(in srgb,var(--warn) 24%,var(--surface)) 8px 11px)}
.cerrado.todo span{position:sticky;top:8px;display:block;margin:8px auto 0;width:max-content;max-width:90%;font-size:12px;font-weight:700;color:var(--warn);background:var(--surface);border-radius:99px;padding:2px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daystate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;padding:10px 12px;margin-bottom:10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.daystate.cerr{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.daystate.cerr b{color:var(--warn)}
.daystate.esp{background:color-mix(in srgb,var(--ok) 10%,var(--surface));border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.ghead small.cerr{color:var(--warn);font-weight:700}
.mcell.cerrada{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--warn) 9%,var(--surface)) 0 8px,color-mix(in srgb,var(--warn) 16%,var(--surface)) 8px 11px)}
.mtag{font-size:10.5px;font-weight:700;color:var(--warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtag.ab{color:var(--ok)}
.ycell.cerrada{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--warn) 18%,var(--surface)) 0 3px,color-mix(in srgb,var(--warn) 34%,var(--surface)) 3px 5px);color:var(--warn)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.hint.bad{color:var(--bad);font-weight:600}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer}
.hsem{display:grid;gap:8px;margin-top:12px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--sunken)}
.hday{display:flex;align-items:center;gap:8px;font-weight:600;min-width:120px}
.hday input{width:18px;height:18px}
.hrow input[type=time]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}
.hrow input[type=time]:disabled{opacity:.45}
.hlist .row{padding-block:9px}

/* bloqueos */
.bloq{position:absolute;left:2px;right:2px;z-index:1;border:1px dashed color-mix(in srgb,var(--muted) 70%,transparent);border-radius:8px;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--muted) 16%,var(--surface)) 0 6px,color-mix(in srgb,var(--muted) 26%,var(--surface)) 6px 9px);padding:3px 6px;text-align:left;cursor:pointer;overflow:hidden}
.bloq span{display:inline-block;font-size:11.5px;font-weight:700;color:var(--ink);background:var(--surface);border-radius:6px;padding:1px 6px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt{z-index:2}
.mtag.bl{color:var(--muted)}
.bloq-ley,.cerr-ley{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.bloq-ley{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--muted) 16%,var(--surface)) 0 3px,color-mix(in srgb,var(--muted) 34%,var(--surface)) 3px 5px);border:1px dashed var(--muted)}
.cerr-ley{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--warn) 14%,var(--surface)) 0 3px,color-mix(in srgb,var(--warn) 30%,var(--surface)) 3px 5px)}
.cap::first-letter{text-transform:uppercase}
.frase{margin:-2px 0 6px;font-size:13px;line-height:1.4;color:var(--muted);font-style:italic;text-wrap:pretty}
.frase span{font-style:normal;font-size:12px;opacity:.85;white-space:nowrap}
.frase.especial{font-style:normal;font-weight:600;color:var(--ink);border-radius:10px;padding:8px 12px;margin:2px 0 8px}
.frase.cumple{background:color-mix(in srgb,#d94f8a 14%,var(--surface));border:1px solid color-mix(in srgb,#d94f8a 35%,var(--line))}
.frase.fiesta{background:color-mix(in srgb,var(--ok) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 35%,var(--line))}
.frase.festivo{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line))}
.frase.especial span{font-weight:500;color:var(--muted)}
/* ficha de cliente y alfabeto */
.tel{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:6px}
.tel select,.tel input{border:1px solid var(--line);background:var(--sunken);border-radius:10px;padding:10px 8px;width:100%;min-width:0}
.salud{border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--surface));border-radius:12px;padding:10px 12px;margin-top:12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.chk input{width:20px;height:20px;flex:none;margin-top:1px}
.salud textarea:disabled{opacity:.5}
.conaz{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:start}
.azlista{min-width:0}
.letra{font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--accent);margin:14px 4px 6px;scroll-margin-top:70px}
.letra:first-child{margin-top:0}
.az{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;border-radius:99px;background:var(--surface);border:1px solid var(--line);max-height:calc(100vh - 120px);overflow-y:auto;scrollbar-width:none}
.az button{border:0;background:none;font-size:11.5px;font-weight:700;color:var(--accent);width:24px;height:20px;padding:0;line-height:20px;border-radius:6px}
.az button:disabled{color:var(--line);cursor:default}
.az button:not(:disabled):active,.az button:not(:disabled):hover{background:var(--accent-soft)}
@media (max-height:640px){.az button{height:16px;line-height:16px;font-size:10.5px}}
.azh{display:flex;gap:4px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
.azh button{flex:none;min-width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--accent)}
.azh button:disabled{color:var(--line);background:var(--sunken)}
.azh button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.results.scroll{max-height:300px;overflow-y:auto}
.results button small{font-size:12px}
/* consentimiento */
.cons-estado{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.hoja-pantalla{background:#fff;color:#111;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px;max-height:46vh;overflow:auto}
.hoja{font-family:Georgia,"Times New Roman",serif;font-size:13px;line-height:1.45;color:#111}
.hoja h1{font-size:18px;margin:0 0 2px;font-family:inherit}
.hoja header p{margin:0 0 10px;color:#444}
.hoja h2{font-size:14px;margin:14px 0 6px;border-bottom:1px solid #999;padding-bottom:2px;font-family:inherit}
.hoja table{border-collapse:collapse;width:100%}
.hoja th,.hoja td{border:1px solid #bbb;padding:5px 8px;text-align:left;font-variant-numeric:normal;white-space:normal;font-size:13px;color:#111}
.hoja th{width:38%;background:#f2f2f2;text-transform:none;letter-spacing:0;font-weight:600}
.hoja .ley{font-size:11.5px;color:#444;margin:0 0 6px}
.hoja dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0}
.hoja dt{font-weight:700}.hoja dd{margin:0}
.hoja .casilla{display:flex;gap:8px;margin:6px 0}.hoja .casilla span{font-size:16px;line-height:1}
.hoja .lugar{margin-top:14px}
.hoja .firma .caja{border:1px solid #999;height:110px;width:min(320px,100%);display:grid;place-items:center;background:#fff}
.hoja .firma img{max-width:100%;max-height:106px}
.hoja .firma p{margin:4px 0 0}
.hoja .nota{font-size:11.5px;color:#444}
.firma-lienzo{width:100%;height:170px;border:2px dashed var(--line);border-radius:12px;background:#fff;touch-action:none;display:block}
#imprimir{display:none}
@media print{
  body>*:not(#imprimir){display:none!important}
  #imprimir{display:block!important}
  body{background:#fff!important}
  .hoja{font-size:11.5pt}
  @page{margin:16mm}
}
.primary.ancho{width:100%;padding:12px 14px}
.cons-txt{font-size:13px;margin:8px 0 0;display:flex;gap:8px;align-items:flex-start}
.cons-txt input{width:18px;height:18px;flex:none;margin:0}
.cons-txt.ok{color:var(--ok)}.cons-txt.warn{color:var(--warn)}.cons-txt.bad{color:var(--bad)}
.cons-txt b{color:inherit}
.hoja .pie{margin-top:16px;border-top:1px solid #ccc;padding-top:6px;font-size:10.5px}
</style>
</head>

<div id="sheet"></div>
<div id="dialog"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
